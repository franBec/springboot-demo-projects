<!doctype html>
<html
  xmlns:th="http://www.thymeleaf.org"
  th:replace="~{layout/main :: layout (${isNew} ? 'Create Film' : 'Edit Film', ~{::section})}"
>
  <body>
    <section class="max-w-3xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
      <a
        th:href="${isNew} ? @{/films} : @{/films/{id}(id=${film.id})}"
        class="text-sm text-sakila-600 dark:text-sakila-400 hover:text-sakila-700 dark:hover:text-sakila-300 mb-6 inline-block"
        >&larr; Back</a
      >

      <div
        class="bg-white dark:bg-gray-800 rounded-xl shadow-md border border-gray-100 dark:border-gray-700 overflow-hidden"
      >
        <div class="px-6 py-4 border-b border-gray-100 dark:border-gray-700">
          <h1
            class="text-xl font-bold text-gray-900 dark:text-gray-100"
            th:text="${isNew} ? 'Create New Film' : 'Edit Film'"
          >
            Create New Film
          </h1>
        </div>
        <div class="p-6">
          <form
            th:action="${isNew} ? @{/films} : @{/films/{id}(id=${film.id})}"
            th:object="${film}"
            method="post"
            class="space-y-6"
          >
            <input type="hidden" name="_method" value="put" th:if="${!isNew}" />
            <div>
              <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1"
                >Title <span class="text-red-500">*</span></label
              >
              <input
                type="text"
                th:field="*{title}"
                required
                maxlength="255"
                class="block w-full rounded-md border-gray-300 dark:border-gray-600 dark:bg-gray-700 dark:text-gray-100 shadow-sm focus:border-sakila-500 focus:ring-sakila-500 px-4 py-2 border"
              />
            </div>
            <div>
              <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1"
                >Description</label
              >
              <textarea
                th:field="*{description}"
                rows="3"
                maxlength="500"
                class="block w-full rounded-md border-gray-300 dark:border-gray-600 dark:bg-gray-700 dark:text-gray-100 shadow-sm focus:border-sakila-500 focus:ring-sakila-500 px-4 py-2 border"
              ></textarea>
            </div>
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-6">
              <div>
                <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1"
                  >Release Year</label
                >
                <input
                  type="number"
                  th:field="*{releaseYear}"
                  min="1900"
                  class="block w-full rounded-md border-gray-300 dark:border-gray-600 dark:bg-gray-700 dark:text-gray-100 shadow-sm focus:border-sakila-500 focus:ring-sakila-500 px-4 py-2 border"
                />
              </div>
              <div>
                <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1"
                  >Rating</label
                >
                <select
                  th:field="*{rating}"
                  class="block w-full rounded-md border-gray-300 dark:border-gray-600 dark:bg-gray-700 dark:text-gray-100 shadow-sm focus:border-sakila-500 focus:ring-sakila-500 px-4 py-2 border"
                >
                  <option value="">-- Select --</option>
                  <option
                    th:each="r : ${allRatings}"
                    th:value="${r.name()}"
                    th:text="${r.value}"
                  >
                    G
                  </option>
                </select>
              </div>
              <div>
                <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1"
                  >Length (minutes)</label
                >
                <input
                  type="number"
                  th:field="*{length}"
                  min="0"
                  class="block w-full rounded-md border-gray-300 dark:border-gray-600 dark:bg-gray-700 dark:text-gray-100 shadow-sm focus:border-sakila-500 focus:ring-sakila-500 px-4 py-2 border"
                />
              </div>
              <div>
                <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1"
                  >Language <span class="text-red-500">*</span></label
                >
                <select
                  th:field="*{language}"
                  required
                  class="block w-full rounded-md border-gray-300 dark:border-gray-600 dark:bg-gray-700 dark:text-gray-100 shadow-sm focus:border-sakila-500 focus:ring-sakila-500 px-4 py-2 border"
                >
                  <option
                    th:each="l : ${allLanguages}"
                    th:value="${l.name()}"
                    th:text="${l.value}"
                  >
                    English
                  </option>
                </select>
              </div>
              <div>
                <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1"
                  >Original Language</label
                >
                <select
                  th:field="*{originalLanguage}"
                  class="block w-full rounded-md border-gray-300 dark:border-gray-600 dark:bg-gray-700 dark:text-gray-100 shadow-sm focus:border-sakila-500 focus:ring-sakila-500 px-4 py-2 border"
                >
                  <option value="">-- None --</option>
                  <option
                    th:each="l : ${allLanguages}"
                    th:value="${l.name()}"
                    th:text="${l.value}"
                  >
                    English
                  </option>
                </select>
              </div>
              <div>
                <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1"
                  >Rental Duration (days)
                  <span class="text-red-500">*</span></label
                >
                <input
                  type="number"
                  th:field="*{rentalDuration}"
                  required
                  min="1"
                  class="block w-full rounded-md border-gray-300 dark:border-gray-600 dark:bg-gray-700 dark:text-gray-100 shadow-sm focus:border-sakila-500 focus:ring-sakila-500 px-4 py-2 border"
                />
              </div>
              <div>
                <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1"
                  >Rental Rate <span class="text-red-500">*</span></label
                >
                <input
                  type="number"
                  step="0.01"
                  th:field="*{rentalRate}"
                  required
                  min="0"
                  class="block w-full rounded-md border-gray-300 dark:border-gray-600 dark:bg-gray-700 dark:text-gray-100 shadow-sm focus:border-sakila-500 focus:ring-sakila-500 px-4 py-2 border"
                />
              </div>
              <div>
                <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1"
                  >Replacement Cost <span class="text-red-500">*</span></label
                >
                <input
                  type="number"
                  step="0.01"
                  th:field="*{replacementCost}"
                  required
                  min="0"
                  class="block w-full rounded-md border-gray-300 dark:border-gray-600 dark:bg-gray-700 dark:text-gray-100 shadow-sm focus:border-sakila-500 focus:ring-sakila-500 px-4 py-2 border"
                />
              </div>
            </div>
            <div>
              <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1"
                >Special Features</label
              >
              <input
                type="text"
                th:field="*{specialFeatures}"
                maxlength="255"
                class="block w-full rounded-md border-gray-300 dark:border-gray-600 dark:bg-gray-700 dark:text-gray-100 shadow-sm focus:border-sakila-500 focus:ring-sakila-500 px-4 py-2 border"
              />
            </div>
            <div class="flex items-center space-x-4 pt-4">
              <button
                type="submit"
                class="bg-sakila-600 hover:bg-sakila-700 text-white px-6 py-2.5 rounded-md font-medium transition"
                th:text="${isNew} ? 'Create Film' : 'Update Film'"
              >
                Create Film
              </button>
              <a
                th:href="${isNew} ? @{/films} : @{/films/{id}(id=${film.id})}"
                class="text-gray-500 dark:text-gray-400 hover:text-gray-700 dark:hover:text-gray-300 font-medium"
                >Cancel</a
              >
            </div>
          </form>
        </div>
      </div>
    </section>
  </body>
</html>
