<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/main :: layout ('Login', ~{::section})}">
<body>
  <section class="min-h-[60vh] flex items-center justify-center px-4">
    <div class="max-w-md w-full">
      <div class="bg-white dark:bg-gray-800 rounded-xl shadow-md border border-gray-100 dark:border-gray-700 p-8">
        <div class="text-center mb-8">
          <h1 class="text-2xl font-bold text-gray-900 dark:text-gray-100">Staff Login</h1>
          <p class="text-gray-600 dark:text-gray-400 mt-2">Sign in to access the admin panel</p>
        </div>

        <div th:if="${param.error}" class="mb-4 p-4 rounded-lg bg-red-50 dark:bg-red-900/30 border border-red-200 dark:border-red-800 text-red-700 dark:text-red-400 text-sm">
          Invalid username or password.
        </div>
        <div th:if="${param.logout}" class="mb-4 p-4 rounded-lg bg-green-50 dark:bg-green-900/30 border border-green-200 dark:border-green-800 text-green-700 dark:text-green-400 text-sm">
          You have been logged out successfully.
        </div>

        <form th:action="@{/login}" method="post" class="space-y-6">
          <div>
            <label for="username" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Username</label>
            <input type="text" id="username" name="username" required autofocus
                   class="block w-full rounded-md border-gray-300 dark:border-gray-600 dark:bg-gray-700 dark:text-gray-100 shadow-sm focus:border-sakila-500 focus:ring-sakila-500 px-4 py-2 border">
          </div>
          <div>
            <label for="password" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Password</label>
            <input type="password" id="password" name="password" required
                   class="block w-full rounded-md border-gray-300 dark:border-gray-600 dark:bg-gray-700 dark:text-gray-100 shadow-sm focus:border-sakila-500 focus:ring-sakila-500 px-4 py-2 border">
          </div>
          <button type="submit"
                  class="w-full bg-sakila-600 hover:bg-sakila-700 text-white font-semibold py-2.5 px-4 rounded-md transition shadow-sm">
            Sign In
          </button>
        </form>

        <div class="mt-6 p-4 bg-gray-50 dark:bg-gray-700 rounded-lg text-xs text-gray-500 dark:text-gray-400">
          <p class="font-medium text-gray-700 dark:text-gray-300 mb-1">Demo Credentials:</p>
          <p>Username: <code class="font-mono bg-gray-200 dark:bg-gray-600 px-1 py-0.5 rounded">Mike</code> &mdash; Password: <code class="font-mono bg-gray-200 dark:bg-gray-600 px-1 py-0.5 rounded">password</code></p>
          <p class="mt-1">Username: <code class="font-mono bg-gray-200 dark:bg-gray-600 px-1 py-0.5 rounded">Jon</code> &mdash; Password: <code class="font-mono bg-gray-200 dark:bg-gray-600 px-1 py-0.5 rounded">password</code></p>
        </div>
      </div>
    </div>
  </section>
</body>
</html>
