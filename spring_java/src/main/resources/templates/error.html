<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/main :: layout ('Error', ~{::section})}">
<body>
  <section>
    <div class="min-h-[80vh] flex items-center justify-center px-4 py-12">
      <div class="max-w-3xl w-full text-center">
        <div class="mb-8">
          <div class="w-24 h-24 bg-red-100 dark:bg-red-900/50 rounded-full flex items-center justify-center mx-auto mb-6">
            <svg class="w-12 h-12 text-red-600 dark:text-red-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path>
            </svg>
          </div>
          <h1 class="text-6xl font-extrabold text-slate-900 dark:text-slate-100 mb-2" th:text="${status ?: '500'}">500</h1>
          <h2 class="text-2xl font-semibold text-slate-700 dark:text-slate-300 mb-4" th:text="${error ?: 'Something went wrong'}">Something went wrong</h2>
          <a href="/" class="inline-flex items-center bg-sakila-500 hover:bg-sakila-600 text-white px-8 py-3 rounded-lg font-semibold text-lg transition shadow-lg">
            <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path>
            </svg>
            Go Home
          </a>
        </div>

        <div x-data="{ copied: false }" class="mt-10 text-left" th:if="${trace}">
          <div class="bg-slate-50 dark:bg-slate-800 rounded-lg border border-slate-200 dark:border-slate-700 p-4 space-y-3">
            <div class="flex items-center justify-between gap-3">
              <h3 class="text-xs font-semibold text-slate-500 dark:text-slate-400 uppercase tracking-wide">Error Details</h3>
              <button @click="navigator.clipboard.writeText($refs.jsonPayload.innerText).then(() => { copied = true; setTimeout(() => copied = false, 2000); })" class="inline-flex items-center text-sm text-sakila-600 dark:text-sakila-400 hover:text-sakila-800 dark:hover:text-sakila-200 font-medium transition shrink-0">
                <svg x-show="!copied" class="w-4 h-4 mr-1.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"></path>
                </svg>
                <svg x-show="copied" class="w-4 h-4 mr-1.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>
                </svg>
                <span x-text="copied ? 'Copied!' : 'Copy JSON'"></span>
              </button>
            </div>

            <pre x-ref="jsonPayload" class="w-full max-h-64 p-3 bg-slate-900 text-slate-300 font-mono text-xs rounded-lg border border-slate-700 overflow-auto">{
  "status": <span th:text="${status}">500</span>,
  "error": "<span th:text="${error}">Internal Server Error</span>",
  "message": "<span th:text="${message}">message</span>",
  "trace": "<span th:text="${trace}">trace-id</span>",
  "instance": "<span th:text="${instance}">/path</span>"
}</pre>
          </div>
        </div>
      </div>
    </div>
  </section>
</body>
</html>
